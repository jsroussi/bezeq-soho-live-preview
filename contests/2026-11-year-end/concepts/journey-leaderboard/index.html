<!doctype html>
<html lang="he" dir="rtl">
<head><meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">

<title>לוח התוצאות · 60 יום מסביב לעולם</title>
<!-- Concept: the October 2026 leaderboard's layout (a band with the day, tabs, meters and tables) for the year-end
     contest, in Bezeq's navy and blue instead of Bezeq energy's, with the journey through it: the nine weeks as a
     route in the band, the week's colour as its highlight, stamps by the takanon (draft 2) instead of October's
     targets, the travel classes (the takanon's gold / silver / bronze under new names) with each class's prizes for the
     end-of-contest lottery, and the peak days in place of October's sprints. Demo data;
     opens from disk. -->
<style>
@font-face { font-family: Simpler; font-weight: 400; src: url("../../../platform/public/fonts/Simpler-Regular.otf"); }
@font-face { font-family: Simpler; font-weight: 700; src: url("../../../platform/public/fonts/Simpler-Bold.otf"); }
@font-face { font-family: Simpler; font-weight: 900; src: url("../../../platform/public/fonts/Simpler-Black.otf"); }
:root {
  --bg: #EBECED; --surface: #FFFFFF; --surface-2: #F5F6F8; --line: #DADCE3; --ink: #20294D; --ink-2: #5B5F75;
  --primary: #0099CC; --primary-ink: #FFFFFF; --primary-soft: #E0F2F9; --primary-text: #007AA3;
  --band: #20294D; --band-2: #2E3152; --band-ink: #FFFFFF; --band-ink-2: #B8BBCC;
  --good: #1F8A5B; --good-soft: #DDF2E8; --bad: #B4372E; --bad-soft: #F9E3E1; --pend: #6B6E80; --pend-soft: #ECEDF1;
  --track: #E4E6EC; --week: #0099CC;
  --font: "Simpler", "Arial Hebrew", Arial, sans-serif; --r-md: 12px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11152B; --surface: #1A2148; --surface-2: #20294D; --line: #2E3466; --ink: #EEF0F6; --ink-2: #A3A7BD;
  --primary: #33B5E0; --primary-ink: #0B2230; --primary-soft: #153A55; --primary-text: #6FCDEB;
  --band: #0B0F22; --band-2: #161B3A; --good: #4FD19A; --good-soft: #123B2D; --bad: #FF8A80; --bad-soft: #3E1A1A; --pend: #A3A7BD; --pend-soft: #262C55;
  --track: #2A3060; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11152B; --surface: #1A2148; --surface-2: #20294D; --line: #2E3466; --ink: #EEF0F6; --ink-2: #A3A7BD;
  --primary: #33B5E0; --primary-ink: #0B2230; --primary-soft: #153A55; --primary-text: #6FCDEB;
  --band: #0B0F22; --band-2: #161B3A; --good: #4FD19A; --good-soft: #123B2D; --bad: #FF8A80; --bad-soft: #3E1A1A; --pend: #A3A7BD; --pend-soft: #262C55;
  --track: #2A3060; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: 16px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* The band: Bezeq navy, the week's colour as the only highlight */
header.band { background: linear-gradient(135deg, var(--band-2), var(--band)); color: var(--band-ink); padding-block: 22px 16px; position: relative; overflow: hidden; }
header.band::after { content: ""; position: absolute; inset: auto 0 0; height: 4px; background: var(--week); }
.band-top { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; justify-content: space-between; }
.brand { font-weight: 700; font-size: 13px; color: var(--band-ink-2); }
.brand b { color: #33B5E0; font-size: 16px; font-weight: 900; margin-inline-end: 6px; }
h1 { font-weight: 900; font-size: clamp(28px, 5vw, 44px); line-height: 1.05; margin: 6px 0; letter-spacing: -0.01em; }
h1 .hl { color: var(--week); }
.sub { color: var(--band-ink-2); font-size: 14px; }
.demo { display: inline-flex; background: rgb(255 255 255 / .12); color: var(--band-ink); font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 999px; margin-inline-start: 8px; }
.asof { display: grid; gap: 6px; min-width: min(100%, 340px); }
.asof label { font-size: 12px; color: var(--band-ink-2); font-weight: 700; }
.asof-row { display: flex; gap: 12px; align-items: center; }
.asof input[type=range] { flex: 1; accent-color: #33B5E0; min-width: 0; }
.asof output { font-weight: 700; font-size: 16px; min-width: 9ch; text-align: center; }
/* The route: nine stops, the week's stop in its colour */
.route { position: relative; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); margin-top: 18px; }
.route::before { content: ""; position: absolute; top: 9px; inset-inline: 5.5%; height: 2px; background: repeating-linear-gradient(90deg, rgb(255 255 255 / .28) 0 6px, transparent 6px 12px); }
.route .done-line { position: absolute; top: 9px; inset-inline-start: 5.5%; height: 2px; background: #33B5E0; transition: width .4s; }
.stop { position: relative; display: grid; justify-items: center; gap: 4px; min-width: 0; text-align: center; }
.stop i { width: 18px; height: 18px; border-radius: 50%; background: var(--band); border: 2px solid rgb(255 255 255 / .35); position: relative; z-index: 1; }
.stop.past i { background: #33B5E0; border-color: #33B5E0; }
.stop.now i { background: #fff; border: 5px solid var(--week); transform: scale(1.25); }
.stop span { font-size: 12px; color: var(--band-ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop.now span { color: #fff; font-weight: 700; }
.stop small { font-size: 10px; color: var(--band-ink-2); opacity: .8; }
.days { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--band-ink-2); }
.days b { color: var(--band-ink); font-size: 16px; }

nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { appearance: none; border: 0; background: none; color: var(--ink-2); font: inherit; font-weight: 700; font-size: 14px; padding: 14px 12px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--primary); }

main { padding-block: 24px 48px; }
section.panel { display: grid; gap: 22px; }
h2 { font-size: 20px; font-weight: 900; margin: 0; }
h3 { font-size: 15px; font-weight: 700; margin: 0; }
.lede { color: var(--ink-2); margin: 4px 0 0; max-width: 74ch; font-size: 14px; }
.head { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.meter, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: grid; gap: 8px; min-width: 0; align-content: start; }
.meter .k { font-size: 13px; color: var(--ink-2); font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.meter .v { font-size: 26px; font-weight: 900; line-height: 1; }
.meter .v small { font-size: 13px; font-weight: 400; color: var(--ink-2); }
.bar { height: 8px; background: var(--track); border-radius: 99px; position: relative; }
.bar > span { position: absolute; inset-block: 0; right: 0; border-radius: 99px; background: var(--primary); max-width: 100%; }
.bar > i { position: absolute; inset-block: -4px; width: 2px; background: var(--ink); opacity: .5; border-radius: 2px; }
.bar > i.gold { width: 4px; background: #C9A227; opacity: 1; }
.bar.done > span { background: var(--good); }
.foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.cond { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-inline-start: 5px solid var(--primary); border-radius: var(--r-md); padding: 14px 16px; }
.cond b.big { font-size: 30px; font-weight: 900; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.pend { background: var(--pend-soft); color: var(--pend); }
.pill.blue { background: var(--primary-soft); color: var(--primary-text); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--ink-2); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--band); color: #fff; }
.rule { display: flex; flex-wrap: wrap; gap: 6px; }
.rule span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
/* The podium of the sector, then the table */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; max-width: 560px; }
.pod { display: grid; gap: 6px; text-align: center; }
.pod .who { font-weight: 900; font-size: 14px; line-height: 1.2; min-height: 2.4em; display: grid; align-items: end; }
.pod .blk { border-radius: 10px 10px 4px 4px; background: var(--band); color: #fff; display: grid; place-content: center; gap: 2px; padding: 8px; }
.pools { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.pool { border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; display: grid; gap: 4px; background: var(--surface-2); }
.pool .row b { font-size: 22px; font-weight: 900; }
.cls { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #1A140C; white-space: nowrap; }
.cls::before { content: "✈"; font-size: .85em; opacity: .7; }
.cls.first { background: linear-gradient(135deg, #F6DB8A, #D4AF37); } .cls.business { background: linear-gradient(135deg, #F1F2F5, #B9BEC8); }
.cls.premium { background: linear-gradient(135deg, #E9B58A, #B87333); } .cls.economy { background: none; color: var(--ink-2); border: 1px dashed currentColor; }
.pod .blk b { font-size: 26px; font-weight: 900; line-height: 1; }
.pod .blk small { font-size: 12px; opacity: .85; }
.pod.p1 .blk { height: 128px; background: var(--primary); color: var(--primary-ink); } .pod.p2 .blk { height: 96px; } .pod.p3 .blk { height: 74px; }
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 600px; }
th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--ink-2); font-weight: 700; background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.rank { width: 44px; font-weight: 900; color: var(--ink-2); }
tr.q td.rank { color: var(--primary-text); }
tr.cut td { padding: 0; border: 0; }
tr.cut div { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); padding: 6px 12px; }
tr.cut div::before, tr.cut div::after { content: ""; flex: 1; border-top: 1px dashed currentColor; opacity: .6; }
.stp { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: center; min-width: 150px; }
.stp .bar { height: 6px; }
/* Peak days: a stamp per week */
.peaks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.peak { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: grid; gap: 6px; border-top: 5px solid var(--c); min-width: 0; }
.peak.upcoming { opacity: .7; }
.peak .city { font-weight: 900; font-size: 17px; }
.peak.today { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); }
details.assume { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 16px; }
details.assume summary { cursor: pointer; font-weight: 700; }
details.assume ul { margin: 10px 0 0; padding-inline-start: 20px; color: var(--ink-2); font-size: 13px; display: grid; gap: 4px; }
@media (max-width: 640px) { .route .stop span, .route .stop small { display: none; } .route .stop.now span { display: block; } .meter .v { font-size: 22px; } }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .25s ease-out; } }
</style>
</head>

<!-- Every concept is a demo (23.10.2026): a label only, the page itself is unchanged. -->
<div class="demo-badge" role="note" dir="rtl" style="position:fixed;top:12px;left:12px;z-index:2147483647;pointer-events:none;background:#F5C342;color:#11152B;font:800 13px/1 Simpler,'Arial Hebrew',Arial,sans-serif;padding:6px 12px;border-radius:999px;box-shadow:0 2px 8px rgb(0 0 0 / .25)">דמו</div>

<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div>
        <div class="brand"><b>בזק</b>אגף סוהו, חשמל ושירותי דיגיטל</div>
        <h1>60 יום <span class="hl">מסביב לעולם</span></h1>
        <div class="sub">לוח התוצאות · <span class="num">01.11–31.12.2026</span> · <span class="num">45</span> ימי עבודה · <span id="weekLine"></span><span class="demo">נתוני דמו</span></div>
      </div>
      <div class="asof">
        <label for="asof">מצב נכון לסוף יום עבודה</label>

      </div>

    <div class="route" id="route" aria-label="המסלול"></div>
    <div class="days">
      <span>ימי עבודה שעברו <b class="num" id="dElapsed"></b> מתוך <b class="num">45</b></span>
      <span>נותרו <b class="num" id="dLeft"></b></span>
      <span id="dPeak"></span>

</header>

<nav class="tabs" aria-label="חלקי הלוח">

    <button role="tab" aria-selected="true" data-tab="overview">סקירת אגף</button>
    <button role="tab" aria-selected="false" data-tab="sales">מכירות</button>
    <button role="tab" aria-selected="false" data-tab="service">שירות ומענה</button>
    <button role="tab" aria-selected="false" data-tab="managers">מנהלים</button>
    <button role="tab" aria-selected="false" data-tab="peaks">ימי שיא</button>
  </div>
</nav>

<main class="wrap">
  <section class="panel" id="p-overview"></section>
  <section class="panel" id="p-sales" hidden></section>
  <section class="panel" id="p-service" hidden></section>
  <section class="panel" id="p-managers" hidden></section>
  <section class="panel" id="p-peaks" hidden></section>
</main>

<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x) => `${Math.round(x * 100)}%`;
const n = (x) => Math.round(x).toLocaleString('he-IL');

// ---------- The journey (contest.json): nine weeks of five working days, the peak on each Wednesday ----------
const STOPS = [['פריז', 'צרפת', '2026-11-01', '#B9A7D6'], ['מילאנו', 'איטליה', '2026-11-08', '#E07B24'], ['מרקש', 'מרוקו', '2026-11-15', '#1F7A5C'],
  ['לאס וגאס', 'ארה״ב', '2026-11-22', '#E2408A'], ['קנקון', 'מקסיקו', '2026-11-29', '#23B3B0'], ['טוקיו', 'יפן', '2026-12-06', '#E4572E'],
  ['אתונה', 'יוון', '2026-12-13', '#C8643B'], ['ניו דלהי', 'הודו', '2026-12-20', '#E58FA0'], ['ירושלים', 'ישראל', '2026-12-27', '#D9A441']];
// The admin page's weeks table (../_shared/admin-weeks.js): the order, names and dates follow it; each destination keeps its own colour.
if (window.ADMIN_WEEKS) STOPS.splice(0, STOPS.length, ...window.ADMIN_WEEKS.arrange(STOPS, (s) => s[0]).map((s, i) => { const w = window.ADMIN_WEEKS.weeks[i]; return [w.he, w.country, w.start, s[3]]; }));
const peakAt = (w) => (window.ADMIN_WEEKS ? window.ADMIN_WEEKS.peakIndex(w) : 3), peakTitle = (w) => (window.ADMIN_WEEKS ? window.ADMIN_WEEKS.weeks[w].peak.title : null);
const DAYS = 45, weekOf = (k) => Math.floor((k - 1) / 5), isPeak = (k) => (k - 1) % 5 === peakAt(weekOf(k));
const dateOf = (k) => { const d = new Date(`${STOPS[weekOf(k)][2]}T12:00:00`); d.setDate(d.getDate() + ((k - 1) % 5)); return d; };
const fmt = (k) => { const d = dateOf(k); return `${d.getDate()}.${d.getMonth() + 1}`; };

// ---------- The takanon (draft 2): stamps per role ----------
const ROLES = {
  soho: { he: 'מכירות סוהו וסוכני שטח', classes: [['first', 0.1, 1], ['business', 0.2, 3], ['premium', 0.2, 3]], kind: 'sales', rules: ['ביזנט: 3', 'IPC: 3', 'אינטרנט / סיב: 2', 'תנאי סף: 350 חותמות'],
    stamps: (t) => 3 * t.biznet + 3 * t.ipc + 2 * t.net, met: (t, s) => s >= 350, toMet: (t, s) => Math.max(0, 350 - s), unit: 'חותמות לתנאי הסף' },
  b144: { he: 'מכירות B144', classes: [['first', 0.1, 1], ['business', 0.2, 3], ['premium', 0.2, 2]], kind: 'sales', rules: ['תנאי סף: 60 מכירות B144 ו-18 ריסלר = חותמת', 'אחר כך חותמת לכל ריסלר נוסף'],
    stamps: (t) => (t.dir + t.res >= 60 && t.res >= 18 ? 1 + (t.res - 18) : 0), met: (t, s) => s >= 1,
    toMet: (t) => Math.max(0, 60 - t.dir - t.res, 18 - t.res), unit: 'מכירות לחותמת הראשונה' },
  elec: { he: 'מכירות חשמל', classes: [['first', 0.1, 1], ['business', 0.2, 1], ['premium', 0.2, 1]], kind: 'sales', rules: ['320 הסכמים חתומים = חותמת', 'כל 5 נוספים: 2 חותמות'],
    stamps: (t) => (t.signed >= 320 ? 1 + 2 * Math.floor((t.signed - 320) / 5) : 0), met: (t, s) => s >= 1, toMet: (t) => Math.max(0, 320 - t.signed), unit: 'הסכמים לחותמת הראשונה' },
  sohoService: { he: 'שירות סוהו', classes: [['business', 0.2, 2], ['premium', 0.2, 2]], kind: 'service', rules: ['ביזנט ממומש: 3', 'IPC ממומש: 3', 'אינטרנט ממומש: 2', 'תנאי סף: ציון 9.0 בסקר 24'],
    stamps: (t) => 3 * t.biznet + 3 * t.ipc + 2 * t.net, met: (t) => t.survey >= 9, toMet: () => 0, survey: 9 },
  voice: { he: 'מענה 144 קולי', classes: [['business', 0.2, 1], ['premium', 0.2, 1]], kind: 'service', rules: ['40 לידים ממומשים = חותמת', 'כל 4 נוספים: חותמת', '3 הראשונים: עוד 5'],
    stamps: (t) => (t.leads >= 40 ? 1 + Math.floor((t.leads - 40) / 4) : 0), met: (t, s) => s >= 1, toMet: (t) => Math.max(0, 40 - t.leads), unit: 'לידים לחותמת הראשונה', top3: 5 },
  elecService: { he: 'שירות חשמל + BO', classes: [['business', 0.2, 1], ['premium', 0.2, 1]], kind: 'service', rules: ['80 לידים = חותמת', 'כל 5 נוספים: חותמת', '25% המרה: עוד חותמת', 'תנאי סף: ציון 8.5 בסקר 24'],
    stamps: (t) => (t.leads >= 80 ? 1 + Math.floor((t.leads - 80) / 5) + (t.conv >= 0.25 ? 1 : 0) : 0), met: (t, s) => s >= 1 && t.survey >= 8.5, toMet: (t) => Math.max(0, 80 - t.leads), unit: 'לידים לחותמת הראשונה', survey: 8.5 },
};

// ---------- Demo data: reps by role and team, daily sales over the 45 days ----------
let seed = 20261101;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const PACE = { soho: { biznet: 1.05, ipc: 0.95, net: 0.5 }, b144: { dir: 1.5, res: 0.55 }, elec: { signed: 7.6 }, sohoService: { biznet: 0.45, ipc: 0.4, net: 0.2 }, voice: { leads: 1.05 }, elecService: { leads: 2, conv: 0 } };
const TEAMS = [['soho', 'מכירות סוהו', 8], ['soho', 'שטח סוהו', 5], ['b144', 'מכירות B144 חיפה', 10], ['elec', 'חשמל 1', 6], ['elec', 'חשמל 2', 5],
  ['sohoService', 'סוהו 1', 7], ['sohoService', 'סוהו ווטסאפ', 6], ['voice', 'מענה 144', 8], ['elecService', 'שירות חשמל', 5]];
const REPS = [];
let k0 = 1;
for (const [role, team, count] of TEAMS) for (let i = 0; i < count; i++) {
  const skill = 0.6 + rnd() * 0.85, late = rnd() * 2 - 1, r = { name: `נציג/ה ${k0++}`, role, team, survey: 8.4 + rnd() * 1.3, conv: 0.15 + rnd() * 0.2, days: [] };
  for (let k = 1; k <= DAYS; k++) {
    const f = skill * (1 + 0.5 * late * (k / DAYS - 0.5)) * (isPeak(k) ? 1.6 : 1), day = {};
    for (const [p, rate] of Object.entries(PACE[role])) day[p] = p === 'conv' ? 0 : Math.max(0, Math.round(rate * f * (0.4 + rnd() * 1.2)));
    r.days.push(day);
  }
  REPS.push(r);
}
const totals = (r, k) => { const t = { survey: r.survey, conv: r.conv }; for (let d = 0; d < k; d++) for (const [p, v] of Object.entries(r.days[d])) t[p] = (t[p] ?? 0) + v; return t; };
function standing(role, k) {
  const R = ROLES[role], list = REPS.filter((r) => r.role === role).map((r) => { const t = totals(r, k), s = R.stamps(t); return { r, t, s, met: R.met(t, s), to: R.toMet(t, s) }; });
  list.sort((a, b) => b.s - a.s || b.t.survey - a.t.survey);
  if (R.top3) list.slice(0, 3).forEach((x) => { if (x.s > 0) x.s += R.top3; });
  list.sort((a, b) => b.s - a.s || b.t.survey - a.t.survey);
  let place = 0; for (const x of list) x.place = x.met && x.s > 0 ? ++place : null;
  // The classes: bands of the role's reps (10% / 20% / 20%, at least one seat), among those placed; the rest fly תיירים.
  const placed = list.filter((x) => x.place); let at = 0;
  for (const [c, share] of R.classes) { const seats = Math.max(1, Math.round(share * list.length)); placed.slice(at, at + seats).forEach((x) => (x.cls = c)); at += seats; }
  return list;
}

// The division's five measures (weights from the takanon) and the departments' weighted targets, against the pace to date.
const DIVISION = [['גיוס אינטרנט / סיב', 0.10, 'net'], ['ביזנט', 0.25, 'biznet'], ['IPC', 0.25, 'ipc'], ['מכירות B144', 0.25, 'b144'], ['הסכמי חשמל', 0.15, 'signed']];
const TARGET_PER_DAY = { net: 7.6, biznet: 15.5, ipc: 14, b144: 20.5, signed: 76 };
const sumDay = (d, key) => REPS.reduce((s, r) => { const x = r.days[d]; if (!x) return s; return s + (key === 'b144' ? (x.dir ?? 0) + (x.res ?? 0) : (r.role.endsWith('ervice') && key !== 'net' ? 0 : x[key] ?? 0)); }, 0);
const measure = (key, k) => { let s = 0; for (let d = 0; d < k; d++) s += sumDay(d, key); return s / (TARGET_PER_DAY[key] * k); };
const DEPTS = [['מוקד סוהו', [['ביזנט', 0.45, 'biznet'], ['IPC', 0.35, 'ipc'], ['אינטרנט / סיב', 0.20, 'net']]], ['מוקד 144 חיפה', [['מדריך + ריסלר', 1, 'b144']]],
  ['פרסום דיגיטלי ת"א', [['מדריך + ריסלר', 1, 'b144']], 0.97], ['מוקד חשמל', [['הסכמים חתומים', 1, 'signed']]]];
const LEAGUES = [['מכירות סוהו ושטח', ['ר"צ מכירות סוהו', 'ר"צ שטח סוהו 1', 'ר"צ שטח סוהו 2']], ['שירות סוהו', ['ר"צ סוהו 1', 'ר"צ סוהו ווטסאפ', 'ר"צ חניכה סוהו']],
  ['פרסום דיגיטלי', ['ר"צ מכירות חיפה 1', 'ר"צ מכירות חיפה 2', 'ר"צ שימור', 'ר"צ מענה 144']], ['חשמל', ['ר"צ חשמל 1', 'ר"צ חשמל 2', 'ר"צ שירות חשמל']]]
  .map(([he, tls]) => [he, tls.map((t) => ({ role: t, lvl: 0.84 + rnd() * 0.36, late: rnd() * 2 - 1 }))]);
const tlAt = (t, k) => t.lvl * (1 + 0.25 * t.late * (k / DAYS - 1));

// ---------- Drawing ----------
const CLS = { first: 'ראשונה', business: 'עסקים', premium: 'פרימיום' };
const badge = (c) => `<span class="cls ${c ?? 'economy'}">${c ? CLS[c] : 'תיירים'}</span>`;
// The week's colour as text and lines on navy: lightened until it reads (4.5:1) on the band.
const lum = (hex) => { const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const mixWhite = (hex, t) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(hex.slice(i, i + 2), 16) + (255 - parseInt(hex.slice(i, i + 2), 16)) * t).toString(16).padStart(2, '0')).join('');
const onNavy = (hex) => { let c = hex, t = 0; while ((lum(c) + 0.05) / (lum('#20294D') + 0.05) < 4.5 && t < 1) { t += 0.1; c = mixWhite(hex, t); } return c; };
let K = 13;
const bar = (frac, mark = 1, scale = 1.3, cls = '') => `<div class="bar ${cls}"><span style="width:${Math.min(100, (frac / scale) * 100)}%"></span>${mark != null && mark <= scale ? `<i style="right:${(mark / scale) * 100}%"></i>` : ''}</div>`;
const nextPeak = (k) => { for (let d = k + 1; d <= DAYS; d++) if (isPeak(d)) return d; return null; };

function header() {
  const w = weekOf(K), [city, country, , acc] = STOPS[w];
  document.documentElement.style.setProperty('--week', onNavy(acc));
  $('asofOut').textContent = `${K} · ${fmt(K)}`;
  $('weekLine').textContent = `שבוע ${w + 1}: ${city}, ${country}`;
  $('dElapsed').textContent = K; $('dLeft').textContent = DAYS - K;
  $('dPeak').innerHTML = isPeak(K) ? `<b style="color:var(--week)">היום יום השיא ב${esc(city)}</b>` : (nextPeak(K) ? `יום השיא הבא: <b class="num">${fmt(nextPeak(K))}</b> ב${esc(STOPS[weekOf(nextPeak(K))][0])}` : '');
  $('route').innerHTML = `<i class="done-line" style="width:${(w / 8) * 89}%"></i>` + STOPS.map(([c, , s], i) => `<div class="stop ${i < w ? 'past' : i === w ? 'now' : ''}"><i></i><span>${esc(c)}</span><small class="num">${s.slice(8)}.${+s.slice(5, 7)}</small></div>`).join('');
}

function overview() {
  const ms = DIVISION.map(([he, w, key]) => ({ he, w, v: measure(key, K) })), total = ms.reduce((s, m) => s + m.w * m.v, 0);
  const allMet = Object.keys(ROLES).reduce((s, r) => s + standing(r, K).filter((x) => x.met).length, 0);
  $('p-overview').innerHTML = `
    <div class="cond"><b class="big num">${pct(total)}</b><div><h3>יעד האגף המשוקלל עד היום</h3><p class="note">התנאי לכל הפרסים בתחרות. אם האגף מתחת ליעד, 70% מהפרסים הולכים רק למחלקות שהגיעו ל-100% (שאלה 24 לסאלי).</p></div>
      ${total >= 1 ? '<span class="pill good">✓ התנאי מתקיים</span>' : `<span class="pill pend">חסרים ${pct(1 - total)}</span>`}</div>
    <div class="meters">${ms.map((m) => `<div class="meter"><div class="k"><span>${esc(m.he)}</span><span class="num">${pct(m.w)}</span></div><div class="v num">${pct(m.v)}</div>${bar(m.v, 1, 1.3, m.v >= 1 ? 'done' : '')}<div class="foot"><span>מול הקצב הנדרש עד היום</span><span>משקל ${pct(m.w)}</span></div></div>`).join('')}</div>
    <div class="head"><div><h2>המחלקות מול 110%</h2><p class="lede">מחלקה שמגיעה ל-110% מהיעד המשוקלל שלה זוכה בפרס מחלקתי. הקו הצהוב הוא 110%.</p></div></div>
    <div class="cards">${DEPTS.map(([he, parts, adj = 1]) => { const vs = parts.map(([, , key]) => measure(key, K) * adj), v = parts.reduce((s, [, w], i) => s + w * vs[i], 0);
      return `<div class="card"><div class="row"><h3>${esc(he)}</h3>${v >= 1.1 ? '<span class="pill good">בדרך לפרס המחלקתי</span>' : v >= 1 ? `<span class="pill blue">עוד ${pct(1.1 - v)} ל-110%</span>` : '<span class="pill pend">מתחת ליעד</span>'}</div>
        <div class="meter" style="border:0;padding:0"><div class="v num">${pct(v)}</div><div class="bar ${v >= 1.1 ? 'done' : ''}"><span style="width:${Math.min(100, v / 1.3 * 100)}%"></span><i style="right:${100 / 1.3}%"></i><i class="gold" style="right:${110 / 1.3}%"></i></div></div>
        <p class="note">${parts.map(([p, w], i) => `${esc(p)} ${pct(w)}: <span class="num">${pct(vs[i])}</span>`).join(' · ')}</p></div>`; }).join('')}</div>
    <div class="meters"><div class="meter"><div class="k">עברו את תנאי הסף</div><div class="v num">${allMet} <small>מתוך ${REPS.length}</small></div>${bar(allMet / REPS.length, 1, 1)}</div>
      <div class="meter"><div class="k">יום השיא של השבוע</div><div class="v">${esc(peakTitle(weekOf(K)) ?? STOPS[weekOf(K)][0])}</div><p class="note">הנושא והתנאים יפורסמו לפני היום</p></div></div>
    <details class="assume"><summary>הנחות הדמו</summary><ul>
      <li>החותמות לפי טיוטה 2 של התקנון. המחלקות (ראשונה, עסקים, פרימיום) הן הזהב, הכסף והארד של התקנון בשמות חדשים, לפי הדירוג: 10% / 20% / 20% מהנציגים בתפקיד. בסוף התחרות, הגרלה בכל מחלקה קובעת מי זוכה באיזה פרס.</li>
      <li>שימור פרסום דיגיטלי לא מוצג: הסולם בטיוטה לא ברור (שאלה 11).</li>
      <li>היעדים במספרים הם דמו: הטיוטה נותנת משקלים בלי יעדים (שאלה 17).</li>
      <li>שובר שוויון: ציון סקר 24, ואז המכירות.</li></ul></details>`;
}

function sector(role, k) {
  const R = ROLES[role], list = standing(role, k), top = list.slice(0, 3);
  const pod = [top[1], top[0], top[2]].map((x, i) => { const p = [2, 1, 3][i]; return x ? `<div class="pod p${p}"><div class="who">${esc(x.r.name)}</div><div class="blk"><b class="num">${n(x.s)}</b><small>חותמות</small></div><span class="note">${x.place ? `מקום ${x.place}` : 'לפני תנאי הסף'} · ${esc(x.r.team)}</span></div>` : '<div class="pod"></div>'; }).join('');
  const max = Math.max(1, ...list.map((x) => x.s));
  let cut = false;
  const rows = list.map((x) => { let pre = ''; if (!x.met && !cut) { cut = true; pre = `<tr class="cut"><td colspan="6"><div>תנאי הסף</div></td></tr>`; }
    return `${pre}<tr class="${x.met ? 'q' : ''}"><td class="rank num">${x.place ?? '–'}</td><td><b>${esc(x.r.name)}</b><span class="note" style="display:block">${esc(x.r.team)}</span></td>
      <td><div class="stp"><b class="num">${n(x.s)}</b>${bar(x.s / max, null, 1)}</div></td>
      <td>${x.met ? '<span class="pill good">✓ עבר/ה</span>' : R.survey ? `<span class="pill pend">סקר 24: ${x.t.survey.toFixed(1)}</span>` : `<span class="pill pend">עוד <span class="num">${n(x.to)}</span> ${R.unit}</span>`}</td>
      <td>${badge(x.cls)}</td><td class="num">${R.survey ? x.t.survey.toFixed(1) : ''}</td></tr>`; }).join('');
  return `<div class="card"><div class="head"><div><h2>${esc(R.he)}</h2><div class="rule" style="margin-top:6px">${R.rules.map((r) => `<span>${esc(r)}</span>`).join('')}</div></div>
    <span class="pill blue">${list.filter((x) => x.met).length} מתוך ${list.length} בתנאי הסף</span></div>
    <div class="podium">${pod}</div>
    <div class="pools">${R.classes.map(([c, , prizes]) => { const who = list.filter((x) => x.cls === c); return `<div class="pool ${c}"><div class="row">${badge(c)}<b class="num">${who.length}</b></div><span class="note">${prizes === 1 ? 'פרס אחד' : `${prizes} פרסים`} בהגרלה בסוף התחרות</span></div>`; }).join('')}</div>
    <div class="tablebox"><table><thead><tr><th>מקום</th><th>נציג/ה</th><th>חותמות</th><th>תנאי הסף</th><th>מחלקה</th><th>${R.survey ? 'סקר 24' : ''}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function managers() {
  $('p-managers').innerHTML = `<div><h2>ליגות מנהלי הצוותים</h2><p class="lede">נכנסים לליגה ב-100% מהיעד הצוותי המשוקלל. מעל 100%: עוד 10 חותמות. המקומות: ראשון 30, שני 10, שלישי 3. הדירוג לפי אחוז העמידה. מנהלי הצוותים לפי תפקיד.</p></div>
    <div class="cards">${LEAGUES.map(([he, tls]) => { const list = tls.map((t) => ({ ...t, v: tlAt(t, K) })).sort((a, b) => b.v - a.v); let p = 0;
      return `<div class="card"><h3>${esc(he)}</h3>${list.map((t) => { const inn = t.v >= 1, place = inn ? ++p : null, st = inn ? 10 + ([30, 10, 3][place - 1] ?? 0) : 0;
        return `<div><div class="row"><span><b>${esc(t.role)}</b>${place ? ` · מקום ${place}` : ''}</span><span class="num">${pct(t.v)}</span></div>${bar(t.v, 1, 1.3, inn ? 'done' : '')}
          <p class="note">${inn ? `בליגה · <span class="num">${st}</span> חותמות` : `עוד <span class="num">${pct(1 - t.v)}</span> לכניסה לליגה`}</p></div>`; }).join('')}</div>`; }).join('')}</div>`;
}

function peaks() {
  $('p-peaks').innerHTML = `<div><h2>ימי השיא</h2><p class="lede">יום שיא אחד בכל שבוע, בנושא של העיר. התנאים והפרסים יאושרו בהמשך, לכן כאן רק התאריך, הסטטוס והמובילים של היום במכירות סוהו.</p></div>
    <div class="peaks">${STOPS.map(([city, country, , c], w) => { const d = w * 5 + peakAt(w) + 1, st = d < K ? 'past' : d === K ? 'today' : 'upcoming';
      const lead = st !== 'upcoming' ? REPS.filter((r) => r.role === 'soho').map((r) => ({ r, s: ROLES.soho.stamps(r.days[d - 1]) })).sort((a, b) => b.s - a.s)[0] : null;
      return `<article class="peak ${st}" style="--c:${c}"><div class="row"><span class="city">${esc(city)}</span><span class="pill ${st === 'past' ? 'good' : st === 'today' ? 'blue' : 'pend'}">${st === 'past' ? 'עבר' : st === 'today' ? 'היום' : 'בקרוב'}</span></div>
        <span class="note">${esc(country)} · <span class="num">${fmt(d)}</span></span><span>${esc(peakTitle(w) ?? 'הנושא: יוכרז')}${window.ADMIN_WEEKS && window.ADMIN_WEEKS.weeks[w].peak.tbd ? ' · פרטים יוכרזו' : ''}</span>
        ${lead ? `<span class="note">מוביל/ה במכירות סוהו: <b>${esc(lead.r.name)}</b> · <span class="num">${n(lead.s)}</span> חותמות ביום</span>` : ''}</article>`; }).join('')}</div>`;
}

function render() {
  header(); overview();
  $('p-sales').innerHTML = `<div class="lede">החותמות של כל תפקיד לפי הטבלה שלו בתקנון. אין השוואה בין תפקידים.</div>` + ['soho', 'b144', 'elec'].map((r) => sector(r, K)).join('');
  $('p-service').innerHTML = ['sohoService', 'voice', 'elecService'].map((r) => sector(r, K)).join('');
  managers(); peaks();
}
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('section.panel').forEach((s) => (s.hidden = s.id !== `p-${b.dataset.tab}`));
});
$('asof').addEventListener('input', (e) => { K = Number(e.target.value); render(); });
const q = new URLSearchParams(location.search);
if (q.get('day')) { K = Math.max(1, Math.min(DAYS, Number(q.get('day')) || 13)); $('asof').value = K; }
if (q.get('tab')) document.querySelector(`.tabs button[data-tab="${q.get('tab')}"]`)?.click();
render();
})();
</script>
</body>
</html>
