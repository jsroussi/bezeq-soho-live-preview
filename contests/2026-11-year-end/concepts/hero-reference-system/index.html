<!doctype html><html lang="he" dir="rtl"><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bezeq · Hero Lab</title><style>:root{font-family:Arial,sans-serif;background:#090e17;color:white}*{box-sizing:border-box}body{margin:0}header{padding:22px 5vw;border-bottom:1px solid #ffffff25;display:flex;justify-content:space-between;align-items:center}small{color:#c7d0d9}main{max-width:1180px;margin:auto;padding:32px 20px}h1{font-size:clamp(2rem,7vw,5rem);margin:0 0 14px}p{line-height:1.6;color:#c7d0d9}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.tabs button{border:1px solid #ffffff40;border-radius:25px;padding:12px 18px;background:#182536;color:white;cursor:pointer}.tabs button[aria-selected=true]{background:#33B5E0;color:#20294D}.hero{min-height:440px;position:relative;overflow:hidden;border-radius:24px;padding:clamp(22px,5vw,58px);background:linear-gradient(115deg,#071320e8,#07132066),radial-gradient(circle at 75% 35%,var(--accent),transparent 48%),#11273a;display:flex;flex-direction:column;justify-content:space-between}.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff50;border-radius:50%;left:10%;top:15%;animation:orbit 18s linear infinite;pointer-events:none}.hero h2{font-size:clamp(3rem,10vw,8rem);line-height:1;margin:18px 0;letter-spacing:-.05em}.hero p{max-width:520px}.eyebrow{color:#33B5E0;letter-spacing:.15em}.stats{display:flex;flex-wrap:wrap;gap:14px}.stat{padding:18px;background:#ffffff12;backdrop-filter:blur(10px);border:1px solid #ffffff25;border-radius:16px;min-width:135px}.stat strong{display:block;font-size:28px}.stat span{font-size:13px;color:#c7d0d9}.bar{height:8px;border-radius:12px;background:#ffffff30;overflow:hidden;margin-top:10px}.bar i{display:block;background:#33B5E0;height:100%;width:72%;animation:fill 1.4s ease-out}.note{font-size:13px;margin-top:18px}.signal{display:flex;gap:8px;align-items:center;color:#33B5E0}.signal i{width:8px;height:8px;background:#33B5E0;border-radius:50%;animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.2;transform:scale(1.7)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes fill{from{width:0}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important}}@media(max-width:550px){.hero{min-height:570px}.stats{display:grid;grid-template-columns:1fr 1fr}.stat{min-width:0}} </style><header><b>בזק · SOHO</b><small>מעבדת קונספטים · דמו</small></header><main><div class="eyebrow">60 DAYS / AROUND THE WORLD</div><h1>חמישה עולמות. תחרות אחת.</h1><p>אב-טיפוס אינטראקטיבי המבוסס על ההשראות שנבחרו. הנתונים כאן להמחשה בלבד; אין חיבור לנתוני מכירות אמיתיים.</p><nav class="tabs" aria-label="בחירת קונספט" id="tabs"></nav><section class="hero" id="hero" aria-live="polite"><div><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="desc"></p></div><div><div class="stats" id="stats"></div><div class="bar"><i></i></div></div></section><p class="note">עיצוב רספונסיבי · RTL · תמיכה בהפחתת תנועה · ללא תמונות חיצוניות · ללא נתוני לקוחות</p></main><script>const looks=[{id:"winzy",name:"Winzy · יעד השבוע",title:"יפן",eyebrow:"WEEK 01 / DESTINATION",desc:"פתיחת שבוע קולנועית: שם מדינה ענק, מסלול טיסה, יעד קבוצתי והצצה ליום השיא.",accent:"#d87c3d",stats:[["01","שבוע במסע"],["72%","התקדמות לדוגמה"],["03","ימים נותרו"]]},{id:"skyline",name:"Skyline · יום שיא",title:"שער ליעד",eyebrow:"PEAK DAY / PORTAL",desc:"שער אדריכלי אל האתגר השבועי, ספירה לאחור, משימה ברורה ותנאי זכאות.",accent:"#d79b60",stats:[["יום ד׳","יום שיא לדוגמה"],["3","משימות"],["72%","התקדמות"]]},{id:"chainex",name:"Chainex · תוצאות",title:"לוח הבקרה",eyebrow:"PERFORMANCE / DEMO",desc:"נתוני מכירות, דירוג לפי תפקיד, מדדי צוות ומגמות. בחיבור עתידי יש להשתמש רק במקור נתונים מאושר.",accent:"#24b998",stats:[["72%","יעד אגפי"],["4","תחומי פעילות"],["09","שבועות"]]},{id:"veluno",name:"Veluno · פרסים",title:"הפרס הבא",eyebrow:"REWARDS / PREVIEW",desc:"תצוגת פרסים קולנועית עם כרטיסים צפים, סטטוס זכאות ותנאי זכייה. הפרסים טרם נקבעו.",accent:"#b99b68",stats:[["?","פרס השבוע"],["?","תנאי זכאות"],["09","תחנות במסע"]]},{id:"network",name:"Network · הישגים",title:"מחוברים לניצחון",eyebrow:"BEZEQ / CONNECTED TEAMS",desc:"רשת צוותים והישגים בהשראת תקשורת, חשמל ושירותים דיגיטליים. ללא דירוג בין תפקידים שאינם בני השוואה.",accent:"#33B5E0",stats:[["SOHO","מכירות ושירות"],["ENERGY","חשמל"],["DIGITAL","שירותים דיגיטליים"]]}];const tabs=document.getElementById("tabs");function show(id){const l=looks.find(x=>x.id===id)||looks[0];document.getElementById("hero").style.setProperty("--accent",l.accent);document.getElementById("eyebrow").textContent=l.eyebrow;document.getElementById("title").textContent=l.title;document.getElementById("desc").textContent=l.desc;document.getElementById("stats").innerHTML=l.stats.map(([a,b])=>'<div class="stat"><strong>'+a+'</strong><span>'+b+'</span></div>').join("");tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.id===l.id)));history.replaceState(null,"","#"+l.id)}looks.forEach(l=>{let b=document.createElement("button");b.textContent=l.name;b.dataset.id=l.id;b.onclick=()=>show(l.id);tabs.appendChild(b)});show(location.hash.slice(1));</script></html>
